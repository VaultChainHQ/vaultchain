name: ci

on:
  push:
    branches: [main, master, "roadmap/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: build devnet image (no push)
        run: docker build -f deploy/Dockerfile.devnet -t vaultl1-devnet:ci .
      - name: build provider image (no push)
        run: docker build -f deploy/Dockerfile.provider -t vaultl1-provider:ci .
      - name: build validator image (no push)
        run: docker build -f deploy/Dockerfile.validator -t vaultl1-validator:ci .
