# Fly.io app for a vaultl1 storage provider. Deploy from the repo root:
#   fly deploy -c fly.provider.toml --ha=false              # vaultl1-provider
#   fly deploy -c fly.provider.toml -a <other-app> --ha=false  # any additional provider
# Needs ONE volume named provider_data in the same region (see docs/FLY-DEVNET.md).
app = "vaultl1-provider"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.provider"

[env]
  CHAIN_ID = "vault-devnet-1"
  # Chain REST over Fly's private network (6PN); not exposed to the internet.
  DEVNET_REST = "http://vaultl1-devnet.internal:1317"
  # PUBLIC_URL (advertised on chain at registration) is derived from the app name
  # by deploy/provider-entrypoint.sh, so this file serves any provider app:
  #   fly deploy -c fly.provider.toml -a vaultl1-provider-2 --ha=false
  # Must fit the volume (1 GB), with headroom for the key and filesystem overhead.
  CAPACITY_BYTES = "700000000"
  COLLATERAL = "1000000000uvault"

[[mounts]]
  source = "provider_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"